name: rent-monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (GitHub может запускать с опозданием на 5–15 мин)
  workflow_dispatch: {}       # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write             # чтобы сохранять state.json обратно в репозиторий

concurrency:
  group: rent-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check new listings
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python monitor.py

      - name: Save state
        run: |
          git config user.name "rent-monitor"
          git config user.email "rent-monitor@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state [skip ci]" && git pull --rebase && git push)
